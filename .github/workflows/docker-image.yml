name: 构建并发布 Docker 镜像

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: crpi-v8ex1zrhoe87bb3d.cn-hangzhou.personal.cr.aliyuncs.com
  IMAGE_NAME: my-acr-demo/dnf
  GHCR_IMAGE: ghcr.io/liukai-weibo/muramura

jobs:
  build-and-push:
    name: 构建并推送应用镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # ACR's personal registry endpoint cannot accept concurrent writes to
    # the shared latest tag reliably.
    concurrency:
      group: docker-main
      cancel-in-progress: true

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 配置 Docker 构建器
        uses: docker/setup-buildx-action@v3

      - name: 登录阿里云镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=build-${{ github.run_number }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          # The ACR personal registry rejects BuildKit's OCI attestation
          # manifests (application/vnd.oci.empty.v1+json).
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 部署到云服务器
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ needs.build-and-push.result == 'success' }}

    steps:
      - name: 通过 SSH 执行服务器更新脚本
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd /root
            test -f ./start.sh
            chmod 700 ./start.sh
            # 磁盘清理：云服务器空间不足会导致镜像拉取解压失败（no space left on device）
            echo '-- disk before cleanup --'
            df -h /
            (docker system prune -af 2>/dev/null || true)
            echo '-- disk after cleanup --'
            df -h /
            set +e
            ./start.sh --ci
            status=$?
            if [ "$status" -ne 0 ]; then
              echo '迁移容器日志：'
              docker logs --tail=200 knowledge-base-migrate-1 || true
              exit "$status"
            fi
