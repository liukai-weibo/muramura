name: 初始化新服务器

# 手动触发。仅用于新服务器首次初始化：
#   1. 上传 backup-db.sh 到 /root
#   2. 用仓库既有的 ACR 凭据登录阿里云镜像仓库（凭据不经过人工）
#   3. 校验 compose 配置并拉取镜像
#
# 使用独立的 NEW_DEPLOY_* Secrets，不影响仍在服务的 DEPLOY_* 目标。
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: crpi-v8ex1zrhoe87bb3d.cn-hangzhou.personal.cr.aliyuncs.com

jobs:
  setup:
    name: 初始化新服务器
    runs-on: ubuntu-latest

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 上传备份脚本到新服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NEW_DEPLOY_HOST }}
          username: ${{ secrets.NEW_DEPLOY_USER }}
          password: ${{ secrets.NEW_DEPLOY_PASSWORD }}
          port: ${{ secrets.NEW_DEPLOY_PORT || 22 }}
          source: deploy/backup-db.sh
          target: /root/
          strip_components: 1
          overwrite: true

      - name: 登录 ACR 并拉取镜像
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.NEW_DEPLOY_HOST }}
          username: ${{ secrets.NEW_DEPLOY_USER }}
          password: ${{ secrets.NEW_DEPLOY_PASSWORD }}
          port: ${{ secrets.NEW_DEPLOY_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            cd /root

            echo '--- 登录阿里云 ACR ---'
            echo '${{ secrets.ACR_PASSWORD }}' | docker login ${{ env.REGISTRY }} \
              --username '${{ secrets.ACR_USERNAME }}' --password-stdin

            echo '--- 校验 compose 配置 ---'
            docker compose --env-file .env config --quiet && echo 'compose 配置有效'

            echo '--- 拉取镜像 ---'
            docker compose --env-file .env pull

            echo '--- 镜像清单 ---'
            docker images

            echo '--- 磁盘 ---'
            df -h /
