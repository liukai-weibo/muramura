name: 诊断 API 注册错误（只读）

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: 读取服务器 API 日志与用户权限
    runs-on: ubuntu-latest
    steps:
      - name: 通过 SSH 采集只读诊断信息
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set +e
            echo '===== containers ====='
            docker ps --format '{{.Names}}\t{{.Status}}\t{{.Ports}}'
            echo '===== app health (inside) ====='
            docker exec knowledge-base-app-1 sh -lc 'curl -s --max-time 10 http://127.0.0.1:8080/health; echo'
            echo '===== app logs (last 200) ====='
            docker logs --tail=200 knowledge-base-app-1 2>&1
            echo '===== migrate logs (last 80) ====='
            docker logs --tail=80 knowledge-base-migrate-1 2>&1
            echo '===== grants for app user ====='
            docker exec knowledge-base-mysql-1 sh -lc 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT user,host FROM mysql.user; SHOW GRANTS FOR CURRENT_USER();" 2>&1' | head -40
            echo '===== recent users ====='
            docker exec knowledge-base-mysql-1 sh -lc 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT COUNT(*) FROM knowledge_base.users; SELECT id,username,created_at FROM knowledge_base.users ORDER BY created_at DESC LIMIT 5;" 2>&1' | head -20
