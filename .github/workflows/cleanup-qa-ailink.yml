name: 清理 AI 链接验收测试账号（仅 qa-ailink）

on:
  workflow_dispatch:

jobs:
  cleanup:
    name: 删除 qa-ailink 测试用户及其数据
    runs-on: ubuntu-latest
    steps:
      - name: 通过 SSH 执行定向清理
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            docker exec -i knowledge-base-mysql-1 sh -lc 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" knowledge_base' <<'SQL'
            SET @pattern = 'qa-ailink-%';
            CREATE TEMPORARY TABLE tmp_ids AS SELECT id FROM users WHERE username LIKE @pattern;
            SELECT COUNT(*) AS matched_users FROM tmp_ids;
            DELETE m FROM ai_conversation_messages m JOIN tmp_ids t ON t.id = m.owner_user_id;
            DELETE c FROM ai_conversations c JOIN tmp_ids t ON t.id = c.owner_user_id;
            DELETE x FROM user_home_ai_card_caches x JOIN tmp_ids t ON t.id = x.owner_user_id;
            DELETE x FROM user_home_ai_cards x JOIN tmp_ids t ON t.id = x.owner_user_id;
            DELETE x FROM item_links x JOIN tmp_ids t ON t.id = x.owner_user_id;
            DELETE x FROM item_status_events x JOIN tmp_ids t ON t.id = x.owner_user_id;
            DELETE x FROM method_applications x JOIN tmp_ids t ON t.id = x.owner_user_id;
            DELETE x FROM method_evidence x JOIN tmp_ids t ON t.id = x.owner_user_id;
            DELETE x FROM method_versions x JOIN tmp_ids t ON t.id = x.owner_user_id;
            DELETE x FROM reviews x JOIN tmp_ids t ON t.id = x.owner_user_id;
            DELETE x FROM items x JOIN tmp_ids t ON t.id = x.owner_user_id;
            DELETE x FROM methods x JOIN tmp_ids t ON t.id = x.owner_user_id;
            DELETE x FROM method_tombstones x JOIN tmp_ids t ON t.id = x.owner_user_id;
            DELETE x FROM exploration_tracks x JOIN tmp_ids t ON t.id = x.owner_user_id;
            DELETE x FROM daily_notes x JOIN tmp_ids t ON t.id = x.owner_user_id;
            DELETE x FROM mood_entries x JOIN tmp_ids t ON t.id = x.owner_user_id;
            DELETE x FROM meal_entries x JOIN tmp_ids t ON t.id = x.owner_user_id;
            DELETE x FROM daily_summaries x JOIN tmp_ids t ON t.id = x.owner_user_id;
            DELETE x FROM daily_diet_recommendations x JOIN tmp_ids t ON t.id = x.owner_user_id;
            DELETE x FROM user_diet_profiles x JOIN tmp_ids t ON t.id = x.owner_user_id;
            DELETE x FROM user_ai_preferences x JOIN tmp_ids t ON t.id = x.owner_user_id;
            DELETE x FROM activity_audit_events x JOIN tmp_ids t ON t.id = x.actor_user_id;
            DELETE x FROM security_audit_events x JOIN tmp_ids t ON t.id = x.actor_user_id;
            DELETE x FROM security_audit_events x JOIN tmp_ids t ON t.id = x.target_user_id;
            DELETE x FROM user_roles x JOIN tmp_ids t ON t.id = x.user_id;
            DELETE x FROM user_roles x JOIN tmp_ids t ON t.id = x.granted_by_user_id;
            DELETE x FROM initial_owner_claims x JOIN tmp_ids t ON t.id = x.user_id;
            DELETE x FROM user_sessions x JOIN tmp_ids t ON t.id = x.user_id;
            DELETE x FROM users x JOIN tmp_ids t ON t.id = x.id;
            DROP TEMPORARY TABLE tmp_ids;
            SELECT COUNT(*) AS remaining_qa_users FROM users WHERE username LIKE 'qa-ailink-%';
            SELECT COUNT(*) AS total_users FROM users;
            SQL
