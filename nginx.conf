server {
  listen 8080;
  server_name _;
  root /app/apps/client/dist;
  index index.html;

  # 生产链路上 nginx 前面还有一层 TLS 终结（Caddy）：公网 HTTPS → Caddy
  # → 明文 HTTP → 本 nginx → 明文 HTTP → Node。因此 `$scheme` 恒为 http，
  # 直接用它会把上游传来的 https 覆盖成 http，导致应用误判请求为明文而
  # 漏掉会话 Cookie 的 `Secure` 标志。
  #
  # 这里用变量条件透传上游值，没有上游时回落到 `$scheme`，使本机开发与
  # 集成测试（直连本 nginx，无 X-Forwarded-Proto）的判定依然正确。
  # 注意：不能改用 map 指令，本文件位于 conf.d 的 server 块内，
  # 而 map 只允许出现在 http 层级。
  set $kb_forwarded_proto $scheme;
  if ($http_x_forwarded_proto != "") {
    set $kb_forwarded_proto $http_x_forwarded_proto;
  }

  location = /health {
    proxy_pass http://127.0.0.1:32146;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $kb_forwarded_proto;
  }

  location /api/v1/ {
    proxy_pass http://127.0.0.1:32146;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $kb_forwarded_proto;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
