services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: knowledge_base
      MYSQL_UAT_DATABASE: knowledge_base_uat
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-knowledge_base_root_password}
      MYSQL_APP_USER: ${MYSQL_APP_USER:?MYSQL_APP_USER is required}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
      MYSQL_MIGRATOR_USER: ${MYSQL_MIGRATOR_USER:?MYSQL_MIGRATOR_USER is required}
      MYSQL_MIGRATOR_PASSWORD: ${MYSQL_MIGRATOR_PASSWORD:?MYSQL_MIGRATOR_PASSWORD is required}
      UAT_MYSQL_APP_USER: ${UAT_MYSQL_APP_USER:-}
      UAT_MYSQL_APP_PASSWORD: ${UAT_MYSQL_APP_PASSWORD:-}
      UAT_MYSQL_MIGRATOR_USER: ${UAT_MYSQL_MIGRATOR_USER:-}
      UAT_MYSQL_MIGRATOR_PASSWORD: ${UAT_MYSQL_MIGRATOR_PASSWORD:-}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/scripts/reconcile-users.sh:/usr/local/bin/reconcile-mysql-users:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
