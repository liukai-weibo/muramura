name: knowledge-base

services:
  mysql:
    image: crpi-v8ex1zrhoe87bb3d.cn-hangzhou.personal.cr.aliyuncs.com/my-acr-demo/mysql:8.4
    environment:
      MYSQL_DATABASE: knowledge_base
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${KB_MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - knowledge_base_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    image: crpi-v8ex1zrhoe87bb3d.cn-hangzhou.personal.cr.aliyuncs.com/my-acr-demo/dnf:${KB_APP_IMAGE_TAG:-latest}
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: knowledge_base
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_UAT_DATABASE: knowledge_base_uat
      MYSQL_APP_USER: ${MYSQL_APP_USER:?MYSQL_APP_USER is required}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
      MYSQL_MIGRATOR_USER: ${MYSQL_MIGRATOR_USER:?MYSQL_MIGRATOR_USER is required}
      MYSQL_MIGRATOR_PASSWORD: ${MYSQL_MIGRATOR_PASSWORD:?MYSQL_MIGRATOR_PASSWORD is required}
      UAT_MYSQL_APP_USER: ${UAT_MYSQL_APP_USER:?UAT_MYSQL_APP_USER is required}
      UAT_MYSQL_APP_PASSWORD: ${UAT_MYSQL_APP_PASSWORD:?UAT_MYSQL_APP_PASSWORD is required}
      UAT_MYSQL_MIGRATOR_USER: ${UAT_MYSQL_MIGRATOR_USER:?UAT_MYSQL_MIGRATOR_USER is required}
      UAT_MYSQL_MIGRATOR_PASSWORD: ${UAT_MYSQL_MIGRATOR_PASSWORD:?UAT_MYSQL_MIGRATOR_PASSWORD is required}
      MYSQL_POOL_CONNECTION_LIMIT: ${MYSQL_POOL_CONNECTION_LIMIT:-5}
    command: ["migrate"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  app:
    image: crpi-v8ex1zrhoe87bb3d.cn-hangzhou.personal.cr.aliyuncs.com/my-acr-demo/dnf:${KB_APP_IMAGE_TAG:-latest}
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: knowledge_base
      MYSQL_APP_USER: ${MYSQL_APP_USER:?MYSQL_APP_USER is required}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
      MYSQL_POOL_CONNECTION_LIMIT: ${MYSQL_POOL_CONNECTION_LIMIT:-5}
      API_HOST: 127.0.0.1
      API_PORT: 32146
    ports:
      - "${KB_H5_BIND_IP:-127.0.0.1}:${KB_H5_HOST_PORT:-10086}:8080"
      - "127.0.0.1:${KB_API_HOST_PORT:-32146}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  knowledge_base_mysql_data:
    name: knowledge_base_mysql_data
